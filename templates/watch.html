<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ kid_name }}Tube – Now Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">🌈 {{ kid_name }}<span>Tube</span></a>
  </header>

  <a href="{{ back_href }}" class="back-btn">{{ back_label }}</a>

  <div class="player-wrapper">
    {% if hls_url %}
    <video id="player" controls autoplay playsinline class="video-player"></video>
    {% elif invidious_embed_url %}
    <iframe
      src="{{ invidious_embed_url }}"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
    {% elif stream_url %}
    <video controls autoplay playsinline class="video-player">
      <source src="{{ stream_url }}">
      Your browser does not support the video tag.
    </video>
    {% else %}
    <div class="player-error">
      <p>This video couldn't be loaded. Try again later or pick another video.</p>
    </div>
    {% endif %}
  </div>

  {% if hls_url %}
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <script>
    (function () {
      const video = document.getElementById("player");
      const src = {{ hls_url | tojson }};
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = src;
        return;
      }
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            hls.loadSource(src);
            hls.startLoad();
          }
        });
        return;
      }
      video.outerHTML = '<div class="player-error"><p>Live stream playback is not supported in this browser.</p></div>';
    })();
  </script>
  {% endif %}

</body>
</html>
