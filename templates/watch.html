<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ kid_name }}Tube – Now Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body
  data-video-id="{{ video_id }}"
  data-is-live="{{ 'true' if is_live else 'false' }}"
  data-hls-url="{{ hls_url or '' }}">

  <header>
    <a href="/" class="logo">🌈 {{ kid_name }}<span>Tube</span></a>
  </header>

  <a href="{{ back_href }}" class="back-btn">{{ back_label }}</a>

  <div class="player-wrapper">
    {% if hls_url %}
    <video id="player" controls autoplay playsinline webkit-playsinline class="video-player"></video>
    {% elif vod_url %}
    <video
      id="player"
      controls
      playsinline
      webkit-playsinline
      preload="none"
      class="video-player"
      data-src="{{ vod_url }}">
    </video>
    {% elif invidious_embed_url %}
    <iframe
      id="player-embed"
      src="{{ invidious_embed_url }}"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
    {% else %}
    <div class="player-error">
      <p>This video couldn't be loaded. Try again later or pick another video.</p>
    </div>
    {% endif %}
  </div>

  {% if hls_url %}
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  {% endif %}
  <script src="/static/watch.js"></script>

</body>
</html>
